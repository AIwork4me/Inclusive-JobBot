name: Evidence and privacy validation
on:
  [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0 jsonschema==4.26.0
      - run: python scripts/tools/scan_sensitive.py
      - run: python scripts/tools/verify_ij06_evidence.py
      - run: python -m scripts.tools.audit_ij07_baseline --check
      - run: python -m scripts.tools.verify_ij07_artifacts
      - run: python -m scripts.tools.build_ij07_passports --check
      - run: python -m scripts.tools.index_ij07_tc_v2_failures evidence/IJ07/tc_v2/holdout --check
      - run: python -m scripts.tools.summarize_ij07_multitool evidence/IJ07/multitool/primary-vulkan-full evidence/IJ07/multitool/primary-vulkan-full/metrics.json --check
        env:
          PYTHONPATH: src
      - run: python -m scripts.tools.archive_ij07_planning --source evidence/IJ07/planning/primary-l0-checkpoint > /dev/null
        env:
          PYTHONPATH: src
      - run: python -m scripts.tools.bundle_ij07_planning evidence/IJ07/planning/primary-vulkan-full
      - run: python -m pytest -q -o asyncio_mode= tests/evidence
