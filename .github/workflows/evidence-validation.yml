name: Evidence and privacy validation
on:
  [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0 jsonschema==4.26.0
      - run: python scripts/tools/scan_sensitive.py
      - run: python scripts/tools/verify_ij06_evidence.py
      - run: python -m scripts.tools.audit_ij07_baseline --check
      - run: python -m pytest -q -o asyncio_mode= tests/evidence
