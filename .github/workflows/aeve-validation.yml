name: AEVE evidence replay on Windows and Linux
on:
  [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0 jsonschema==4.26.0
      - run: python -m evaluation.aeve verify
      - run: python -m evaluation.aeve.report_qualification --replay evidence/IJ073/aeve/judge_qualification.json --output ${{ runner.temp }}/aeve-qualification.json
      - run: python -m evaluation.aeve.meta_evaluation --split qualification --replay evidence/IJ073/aeve/qualification_meta.json --output ${{ runner.temp }}/aeve-meta.json
