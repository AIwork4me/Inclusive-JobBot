name: Windows and Linux software tests
on:
  [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0 jsonschema==4.26.0
      - run: python -m pytest -q -o asyncio_mode=
      - run: python -m evaluation.aeve verify
        env:
          PYTHONPATH: src
      - run: python -m pip check
