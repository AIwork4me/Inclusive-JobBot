name: Protocol regressions (software only)
on:
  [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest==9.2.0 jsonschema==4.26.0
      - run: python benchmarks/tool_calling/generators/generate_dataset.py --check
      - run: python -m pytest -q -o asyncio_mode= tests/test_tool_calling_benchmark.py tests/antigravity
